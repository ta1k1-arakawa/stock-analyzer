name: EXP-004 forward test

on:
  # 日本時間 19:00（UTC 10:00）の平日。当日の株価と夕方の決算短信が出た後に動かす
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp004-forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install pandas numpy requests lightgbm yfinance pypdf
        npm install -g @anthropic-ai/claude-code

    # 無料のデータ：株価は yfinance、決算データは TDnet（東証の適時開示）
    - name: Update data
      run: python experiments/exp004_forward.py update-data

    # Claude の契約（Pro/Max）の利用枠で決算短信を読む。API の従量課金は使わない
    - name: Claude reads new earnings reports
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      run: python experiments/exp004_forward.py score

    - name: Execute paper orders and decide the next ones
      run: python experiments/exp004_forward.py step

    - name: Check Claude ratings (amendment 1)
      run: python experiments/exp004_forward.py eval-l

    - name: Send R's orders to Slack
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: python experiments/exp004_forward.py notify

    - name: Commit forward records
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add forward/
        if git diff --cached --quiet; then
          echo "No changes"
        else
          git commit -m "EXP-004 forward update [skip ci]"
          git push
        fi

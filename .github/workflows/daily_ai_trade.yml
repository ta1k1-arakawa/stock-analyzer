name: Daily Stock AI Prediction

on:
  # 主な起動は外部スケジューラ (Muse の cron) が平日 16:07 JST に
  # workflow_dispatch API を叩く形に移した。
  # GitHub の schedule は時刻保証がなく、実測で 5〜10 時間遅れるため、
  # ここでは保険としてだけ残す (16:07 本命 + 19:07 再試行)。
  # predict.py 側に「同じデータ日付は処理済み」ガードがあるので、
  # 起動が重なっても通知・記録は二重にならない。
  schedule:
    - cron: '7 16 * * 1-5'
      timezone: "Asia/Tokyo"
    - cron: '7 19 * * 1-5'
      timezone: "Asia/Tokyo"

  # 手動実行 / 外部スケジューラからの起動
  workflow_dispatch:
    inputs:
      force:
        description: '処理済みガードを無効にして再通知する'
        required: false
        type: boolean
        default: false

# 同じワークフローの同時実行を防ぐ (終わるまで次を待たせる)
concurrency:
  group: daily-stock-ai-prediction
  cancel-in-progress: false

# GitHubの権限設定 (CSVを保存するために必要)
permissions:
  contents: write

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo

    steps:
    # 1. コードを取得
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Python環境のセットアップ
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # 3. ライブラリのインストール
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirement.txt

    - name: Show dependency versions
      run: |
        python -c "import pandas, requests; print('pandas', pandas.__version__); print('requests', requests.__version__)"

    # 4. AIの学習
    - name: Train Model
      run: python train.py

    # 5. 予測とLINE通知
    - name: Predict and Notify
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        FORCE_PREDICTION: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      run: python main.py

    # ★重要追加: CSV(成績表)と処理済みマーカーをリポジトリに保存する
    - name: Commit and Push Trade Log
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        for f in data/trade_log_*.csv data/prediction_done_*.txt; do
          if [ -e "$f" ]; then git add -f "$f"; fi
        done

        # 変更がある場合のみコミットしてプッシュ
        if git diff --cached --quiet; then
          echo "No changes to trade logs"
        else
          git commit -m "Update trade log [skip ci]"
          git push
        fi
